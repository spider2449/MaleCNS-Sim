[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malecns-sim"
version = "0.3.0"
description = "Deterministic connectome simulation workbench and resumable LIF runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
gpu = ["cupy-cuda12x[ctk]==14.2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
malecns-sim = "malecns_sim.cli:main"
malecns-workbench = "malecns_sim.application.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"malecns_sim.application" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
