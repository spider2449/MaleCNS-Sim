[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malecns-sim"
version = "0.2.0"
description = "Deterministic MaleCNS connectome ingestion and sparse graph baseline"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
gpu = ["cupy-cuda12x==14.2.0"]

[project.scripts]
malecns-sim = "malecns_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
