<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaleCNS closed loop</title>
<style>
:root { color-scheme: dark; --bg:#0e141b; --panel:#16202a; --edge:#2b3a49; --text:#d9e2ec; --muted:#8aa0b4; }
:root[data-theme="light"] { color-scheme: light; --bg:#f4f7fa; --panel:#ffffff; --edge:#c9d4de; --text:#1b2733; --muted:#5b6f82; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: light; --bg:#f4f7fa; --panel:#ffffff; --edge:#c9d4de; --text:#1b2733; --muted:#5b6f82; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
header { padding:14px 16px 6px; }
h1 { margin:0; font-size:20px; }
h2 { margin:0 0 8px; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
#status { margin:4px 0 0; color:var(--muted); }
main { display:grid; gap:12px; padding:10px 16px 20px; grid-template-columns:minmax(300px, 360px) 1fr; }
.panel { background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:12px; min-width:0; }
.wide { grid-column:1 / -1; }
@media (max-width: 820px) { main { grid-template-columns:1fr; } }
#frame { width:100%; image-rendering:pixelated; border-radius:4px; background:#000; display:block; }
#bearing { position:relative; height:14px; margin:10px 0 4px; background:var(--bg); border:1px solid var(--edge); border-radius:7px; }
#bearing i { position:absolute; top:-1px; width:12px; height:14px; border-radius:6px; background:#e8a33d; transform:translateX(-6px); }
#bearing b { position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--muted); }
.buttons { display:flex; gap:8px; margin-top:10px; }
.buttons div { flex:1; text-align:center; padding:6px 0; border:1px solid var(--edge); border-radius:6px; color:var(--muted); }
.buttons div.on { color:#0e141b; font-weight:600; }
svg { width:100%; height:auto; display:block; }
canvas { width:100%; height:auto; display:block; }
.legend span { display:inline-block; margin-right:14px; color:var(--muted); }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.note { color:var(--muted); font-size:12px; margin:8px 0 0; }
</style>
</head>
<body>
<header>
<h1>MaleCNS closed loop</h1>
<p id="status" role="status">Connecting to the local loop…</p>
</header>
<main>
<section class="panel">
<h2>Game</h2>
<img id="frame" alt="Current game screen" width="320" height="240">
<div id="bearing" aria-label="Monster bearing relative to the crosshair"><b></b><i></i></div>
<div class="buttons" id="buttons"></div>
<p class="note" id="gameinfo"></p>
</section>
<section class="panel">
<h2>Neural circuit (activity per decision)</h2>
<svg id="circuit" viewBox="0 0 640 300" role="img" aria-label="Circuit graph: input populations, the connectome, and readout populations"></svg>
<p class="note" id="notes"></p>
</section>
<section class="panel wide">
<h2>Spike raster, last 200 ms of neural time</h2>
<canvas id="raster" width="1200" height="300"></canvas>
<div class="legend" id="rasterlegend"></div>
</section>
<section class="panel wide">
<h2>Mean firing rate per population (Hz) and whole-network spikes per decision</h2>
<canvas id="traces" width="1200" height="260"></canvas>
<div class="legend" id="tracelegend"></div>
</section>
</main>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const api = (path, extra) => path + "?token=" + encodeURIComponent(token) + (extra || "");
const $ = id => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";
const WINDOW_MS = 200, KEEP = 400, MIN_BAND = 6;
let meta = null, rows = [], since = 0, groupMax = {}, spikeMax = 1, nodes = {}, edges = [];

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function el(tag, attrs, text) {
  const node = document.createElementNS(SVG, tag);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  if (text !== undefined) node.textContent = text;
  return node;
}

function legend(target, items) {
  target.replaceChildren();
  for (const item of items) {
    const span = document.createElement("span");
    const swatch = document.createElement("i");
    swatch.style.background = item.color;
    span.append(swatch, item.label);
    target.append(span);
  }
}

function build() {
  const svg = $("circuit");
  const circuit = meta.circuit;
  for (const [from, to] of circuit.edges) {
    const a = circuit.nodes.find(n => n.id === from), b = circuit.nodes.find(n => n.id === to);
    const line = el("line", { x1: a.x * 640, y1: a.y * 300, x2: b.x * 640, y2: b.y * 300, stroke: cssVar("--muted"), "stroke-width": 1, opacity: 0.3 });
    svg.append(line);
    edges.push({ from, to, line });
  }
  for (const n of circuit.nodes) {
    const g = el("g", {});
    const radius = n.radius || 30;
    const backing = el("circle", { cx: n.x * 640, cy: n.y * 300, r: radius, fill: cssVar("--panel") });
    const disc = el("circle", { cx: n.x * 640, cy: n.y * 300, r: radius, fill: n.color, "fill-opacity": 0.12, stroke: n.color, "stroke-width": 2 });
    const label = el("text", { x: n.x * 640, y: n.y * 300 - 4, "text-anchor": "middle", fill: cssVar("--text"), "font-size": 11 }, n.label);
    const value = el("text", { x: n.x * 640, y: n.y * 300 + 12, "text-anchor": "middle", fill: cssVar("--muted"), "font-size": 11 }, "");
    g.append(backing, disc, label, value);
    svg.append(g);
    nodes[n.id] = { spec: n, disc, value, label };
  }
  $("notes").textContent = (meta.notes || []).join(" ");
  const buttons = $("buttons");
  meta.buttons.forEach(b => {
    const d = document.createElement("div");
    d.textContent = b.label;
    d.dataset.color = b.color;
    buttons.append(d);
  });
  legend($("rasterlegend"), meta.groups.map(g => ({ color: g.color, label: `${g.label} (${g.size})` })));
  legend($("tracelegend"), meta.groups.map(g => ({ color: g.color, label: g.label })).concat([{ color: "#7f8c99", label: "network spikes / decision" }]));
}

function intensity(group, value) {
  groupMax[group] = Math.max(groupMax[group] || 5, value);
  return Math.min(1, value / groupMax[group]);
}

function drawCircuit(row) {
  const level = {};
  for (const id in nodes) {
    const spec = nodes[id].spec;
    let value = 0, text = "";
    if (spec.group) { value = row.rates_hz[spec.group] || 0; text = value.toFixed(1) + " Hz"; level[id] = intensity(spec.group, value); }
    else if (spec.kind === "network") { value = row.network_spikes; spikeMax = Math.max(spikeMax, value); text = value + " spikes"; level[id] = Math.min(1, value / spikeMax); }
    else if (spec.kind === "bearing") { const x = row.monster_x; text = x === null ? "no monster" : (x < 0 ? "left " : "right ") + Math.abs(x).toFixed(2); level[id] = x === null ? 0 : 1; }
    const lit = level[id] || 0;
    nodes[id].disc.setAttribute("fill-opacity", (0.12 + 0.8 * lit).toFixed(2));
    nodes[id].label.setAttribute("fill", lit > 0.55 ? "#0e141b" : cssVar("--text"));
    nodes[id].value.setAttribute("fill", lit > 0.55 ? "#0e141b" : cssVar("--muted"));
    nodes[id].value.textContent = text;
  }
  for (const e of edges) {
    e.line.setAttribute("opacity", (0.15 + 0.7 * (level[e.from] || 0)).toFixed(2));
    e.line.setAttribute("stroke-width", (1 + 4 * (level[e.from] || 0)).toFixed(1));
  }
}

function drawRaster(episodeRows) {
  const canvas = $("raster"), ctx = canvas.getContext("2d"), w = canvas.width, h = canvas.height, left = 200;
  ctx.clearRect(0, 0, w, h);
  const band = g => Math.max(g.size, MIN_BAND);
  const total = meta.groups.reduce((sum, g) => sum + band(g), 0), unit = h / total;
  let start = 0;
  const top = {};
  meta.groups.forEach((g, i) => {
    top[g.key] = start * unit;
    if (i % 2 === 0) { ctx.fillStyle = "rgba(127,140,153,0.08)"; ctx.fillRect(left, start * unit, w - left, band(g) * unit); }
    ctx.fillStyle = g.color; ctx.font = "13px system-ui"; ctx.textBaseline = "middle";
    ctx.fillText(g.label, 6, (start + band(g) / 2) * unit);
    start += band(g);
  });
  const tNow = episodeRows[episodeRows.length - 1].neural_time_ms, t0 = tNow - WINDOW_MS;
  for (const r of episodeRows) {
    if (r.neural_time_ms < t0) continue;
    for (const [row, t] of r.raster) {
      if (t < t0) continue;
      const g = meta.groups.find(group => row >= group.offset && row < group.offset + group.size);
      const slot = band(g) * unit / g.size;
      ctx.fillStyle = g.color;
      ctx.fillRect(left + (t - t0) / WINDOW_MS * (w - left - 4), top[g.key] + (row - g.offset) * slot, 3, Math.min(8, Math.max(2, slot - 1)));
    }
  }
}

function drawTraces(episodeRows) {
  const canvas = $("traces"), ctx = canvas.getContext("2d"), w = canvas.width, h = canvas.height, pad = 30;
  ctx.clearRect(0, 0, w, h);
  const recent = episodeRows.slice(-150), n = Math.max(recent.length - 1, 1);
  const x = i => pad + i / n * (w - pad - 8);
  let top = 5;
  for (const r of recent) for (const g of meta.groups) top = Math.max(top, r.rates_hz[g.key] || 0);
  let spikeTop = 1;
  for (const r of recent) spikeTop = Math.max(spikeTop, r.network_spikes);
  ctx.fillStyle = "rgba(127,140,153,0.25)";
  recent.forEach((r, i) => { const bar = r.network_spikes / spikeTop * h * 0.35; ctx.fillRect(x(i) - 2, h - bar, 4, bar); });
  for (const g of meta.groups) {
    ctx.strokeStyle = g.color; ctx.lineWidth = 2; ctx.beginPath();
    recent.forEach((r, i) => { const y = h - 4 - (r.rates_hz[g.key] || 0) / top * (h - 12); i ? ctx.lineTo(x(i), y) : ctx.moveTo(x(i), y); });
    ctx.stroke();
  }
  ctx.fillStyle = cssVar("--muted"); ctx.font = "12px system-ui";
  ctx.fillText(top.toFixed(0) + " Hz", 2, 12); ctx.fillText("0", 12, h - 4);
  ctx.textAlign = "right"; ctx.fillText("grey bars: up to " + spikeTop + " network spikes", w - 8, 12); ctx.textAlign = "left";
}

function render(latest) {
  const episodeRows = rows.filter(r => r.episode === latest.episode);
  const slow = latest.neural_wall_ms / latest.neural_ms;
  $("status").textContent = `Episode ${latest.episode} · decision ${latest.step} · neural time ${latest.neural_time_ms.toFixed(0)} ms · `
    + `${latest.neural_wall_ms.toFixed(0)} ms of computing per ${latest.neural_ms} ms of neural time (${slow.toFixed(0)}x slower than real time)`;
  $("gameinfo").textContent = `Reward ${latest.total_reward.toFixed(0)} · kills ${latest.kills} · ${latest.input_events} input events, ${latest.network_spikes} network spikes this decision`
    + (latest.done ? " · episode ended" : "");
  $("frame").src = api("/frame.png", "&v=" + latest.seq);
  const marker = document.querySelector("#bearing i");
  marker.style.left = latest.monster_x === null ? "50%" : ((latest.monster_x + 1) / 2 * 100) + "%";
  marker.style.opacity = latest.monster_x === null ? 0.2 : 1;
  [...$("buttons").children].forEach((d, i) => {
    const on = !!latest.command[i];
    d.classList.toggle("on", on);
    d.style.background = on ? d.dataset.color : "transparent";
  });
  drawCircuit(latest); drawRaster(episodeRows); drawTraces(episodeRows);
}

async function poll() {
  try {
    if (!meta) { meta = await (await fetch(api("/api/meta"))).json(); build(); }
    const data = await (await fetch(api("/api/state", "&since=" + since))).json();
    if (data.rows.length) {
      rows = rows.concat(data.rows).slice(-KEEP);
      since = rows[rows.length - 1].seq;
      render(rows[rows.length - 1]);
    }
  } catch (error) {
    $("status").textContent = "Disconnected from the local loop; is the program still running?";
  }
  setTimeout(poll, 250);
}
poll();
</script>
</body>
</html>
