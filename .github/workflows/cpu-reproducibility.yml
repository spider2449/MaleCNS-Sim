name: Generic CPU reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - name: Frozen CPU dependency installation
        run: uv sync --frozen --group dev
      - name: Data-free and synthetic tests
        run: uv run --frozen pytest
      - name: Compile Python sources
        run: uv run --frozen python -m compileall src scripts tests
      - name: Build package
        run: uv build
      - name: Installed package import
        run: |
          python -m venv "$RUNNER_TEMP/malecns-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/malecns-wheel-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/malecns-wheel-smoke/bin/python" -I -c "import malecns_sim; import malecns_sim.analysis.task018; print('installed malecns_sim import PASS')"
      - name: Offline tracked integrity
        run: uv run --frozen python scripts/check_tracked_integrity.py
